[package]
name = "termwave"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A lightweight, cross-platform, lossless-first terminal Hi-Fi music player"
readme = "README.md"
keywords = ["audio", "flac", "music", "player", "terminal"]
categories = ["multimedia::audio", "command-line-utilities"]

# Dependencies are introduced incrementally per roadmap phase.
[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.5"
lofty = "0.24.0"
ratatui = "0.29"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-flac"] }
rusqlite = { version = "0.34", features = ["bundled"] }
symphonia = { version = "0.5", default-features = false, features = ["flac"] }
thiserror = "2.0"
walkdir = "2.5"
